services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev_api_key}
    volumes:
      # Optional: Mount your local gcloud credentials for GCP access
      # - ~/.config/gcloud:/root/.config/gcloud:ro
      - ./app:/app/app
