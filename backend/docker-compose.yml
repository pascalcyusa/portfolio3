version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
    volumes:
      # Optional: Mount your GCP key if you have one locally
      # - ./gcp-key.json:/app/gcp-key.json
      - ./app:/app/app
      - ADMIN_API_KEY=${ADMIN_API_KEY:-dev_api_key}
