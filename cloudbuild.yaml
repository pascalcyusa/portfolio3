steps:
  # Step 1: Sync images to Google Cloud Storage (if any exist locally)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [ -d "public/images" ]; then
          gcloud storage cp -r public/images/* gs://$_GCS_BUCKET_NAME/images/
        else
          echo "No public/images folder found to upload (expected — images are already in GCS)."
        fi

  # Step 2: Build and Deploy the backend to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "portfolio-backend"
      - "--source"
      - "./backend"
      - "--region"
      - "$_GCP_REGION"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "^;;^GCS_BUCKET_NAME=$_GCS_BUCKET_NAME;;BACKEND_CORS_ORIGINS=$_BACKEND_CORS_ORIGINS;;ENVIRONMENT=production"
      - "--set-secrets"
      - "^;;^DATABASE_URL=DATABASE_URL:latest;;ADMIN_API_KEY=ADMIN_API_KEY:latest;;CLERK_SECRET_KEY=CLERK_SECRET_KEY:latest;;CLERK_PUBLISHABLE_KEY=CLERK_PUBLISHABLE_KEY:latest"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "2"
      - "--cpu"
      - "1"
      - "--memory"
      - "512Mi"
      - "--concurrency"
      - "40"
      - "--cpu-throttling"

options:
  requestedVerifyOption: "NOT_VERIFIED"
  logging: "CLOUD_LOGGING_ONLY"

substitutions:
  _GCP_REGION: "us-east4"
  _GCS_BUCKET_NAME: "portfolio3-images-bucket"
  _BACKEND_CORS_ORIGINS: "https://pascalcyusa.com,https://www.pascalcyusa.com,https://portfolio3-test.netlify.app"
